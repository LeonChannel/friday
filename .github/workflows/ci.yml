name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Mapa do código
        run: swift scripts/mapa.swift --check
      - name: Testes do FridayKit
        working-directory: Packages/FridayKit
        run: swift test
      - name: Build do app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Friday.xcodeproj -scheme Friday -destination 'platform=macOS' -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation build
