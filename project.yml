name: Friday
options:
  bundleIdPrefix: com.leonchannel
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  FridayKit:
    path: Packages/FridayKit
targets:
  Friday:
    type: application
    platform: macOS
    sources:
      - path: Friday
        excludes: [Resources/**]
      - path: Friday/Resources/bin
        type: folder
        buildPhase: resources
      - path: Friday/Resources/claude-plugin
        type: folder
        buildPhase: resources
    dependencies:
      - package: FridayKit
        product: FridayFeatures
      - package: FridayKit
        product: FridayInfrastructure
      - package: FridayKit
        product: FridayCLI
    info:
      path: Friday/App/Info.plist
      properties:
        CFBundleDisplayName: Friday
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Leonardo Porte"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonchannel.friday
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Friday:
    build:
      targets:
        Friday: all
